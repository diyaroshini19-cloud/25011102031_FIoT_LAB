<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2457a7"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="40" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#16243a">CAT12 TASK12A - onboard LED output</text>
<text x="40" y="94" font-family="Arial,sans-serif" font-size="17" fill="#526176">TASK12A configures PA5 as GPIO output on STM32F401RE</text>
<rect x="36" y="205" width="590" height="260" rx="18" fill="#eaf2ff" stroke="#526176" stroke-width="2"/>
<text x="54" y="243" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16243a">STM32F401RE / Nucleo</text>
<line x1="54" y1="259" x2="608" y2="259" stroke="#aab6c5"/>
<text x="54" y="289" font-family="Arial,sans-serif" font-size="15" fill="#243247">PA5 = GPIO output</text>
<text x="54" y="316" font-family="Arial,sans-serif" font-size="15" fill="#243247">HAL toggles output</text>
<text x="54" y="343" font-family="Arial,sans-serif" font-size="15" fill="#243247">Board ground</text>
<rect x="654" y="205" width="590" height="260" rx="18" fill="#eaf8f0" stroke="#526176" stroke-width="2"/>
<text x="672" y="243" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16243a">LD2 LED</text>
<line x1="672" y1="259" x2="1226" y2="259" stroke="#aab6c5"/>
<text x="672" y="289" font-family="Arial,sans-serif" font-size="15" fill="#243247">On-board LED</text>
<text x="672" y="316" font-family="Arial,sans-serif" font-size="15" fill="#243247">Connected to PA5</text>
<line x1="631" y1="335" x2="649" y2="335" stroke="#2457a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="619" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#2457a7">PA5 output</text>
<text x="40" y="578" font-family="Arial,sans-serif" font-size="14" fill="#526176">The supplied CAT12 image labels PC13 as LED output, but the task configuration uses PC13 as input and PA5 as output.</text>
</svg>
