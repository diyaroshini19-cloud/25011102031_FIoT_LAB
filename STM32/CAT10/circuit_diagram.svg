<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2457a7"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="40" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#16243a">CAT10 TASK10A-C - STM32 and ESP8266 serial links</text>
<text x="40" y="94" font-family="Arial,sans-serif" font-size="17" fill="#526176">Shared physical UART wiring confirmed by the three task .ioc files</text>
<rect x="36" y="205" width="384" height="260" rx="18" fill="#eaf2ff" stroke="#526176" stroke-width="2"/>
<text x="54" y="243" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16243a">PC terminal</text>
<line x1="54" y1="259" x2="402" y2="259" stroke="#aab6c5"/>
<text x="54" y="289" font-family="Arial,sans-serif" font-size="15" fill="#243247">Adapter TX -&gt; PA3</text>
<text x="54" y="316" font-family="Arial,sans-serif" font-size="15" fill="#243247">PA2 -&gt; adapter RX</text>
<text x="54" y="343" font-family="Arial,sans-serif" font-size="15" fill="#243247">USART2 / common ground</text>
<rect x="448" y="205" width="384" height="260" rx="18" fill="#eaf8f0" stroke="#526176" stroke-width="2"/>
<text x="466" y="243" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16243a">STM32F103C8T6</text>
<line x1="466" y1="259" x2="814" y2="259" stroke="#aab6c5"/>
<text x="466" y="289" font-family="Arial,sans-serif" font-size="15" fill="#243247">USART2: PA2 TX / PA3 RX</text>
<text x="466" y="316" font-family="Arial,sans-serif" font-size="15" fill="#243247">USART1: PA9 TX / PA10 RX</text>
<text x="466" y="343" font-family="Arial,sans-serif" font-size="15" fill="#243247">Both used for serial I/O</text>
<rect x="860" y="205" width="384" height="260" rx="18" fill="#fff4df" stroke="#526176" stroke-width="2"/>
<text x="878" y="243" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16243a">Wemos D1 Mini / ESP8266</text>
<line x1="878" y1="259" x2="1226" y2="259" stroke="#aab6c5"/>
<text x="878" y="289" font-family="Arial,sans-serif" font-size="15" fill="#243247">RX &lt;- PA9 (USART1 TX)</text>
<text x="878" y="316" font-family="Arial,sans-serif" font-size="15" fill="#243247">TX -&gt; PA10 (USART1 RX)</text>
<text x="878" y="343" font-family="Arial,sans-serif" font-size="15" fill="#243247">3.3 V UART logic</text>
<line x1="425" y1="335" x2="443" y2="335" stroke="#2457a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="413" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#2457a7">debug UART</text>
<line x1="837" y1="335" x2="855" y2="335" stroke="#2457a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="825" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#2457a7">AT / modem UART</text>
<text x="40" y="578" font-family="Arial,sans-serif" font-size="14" fill="#526176">Cross TX and RX at each UART link. Power requirements depend on the actual Wemos/module board.</text>
</svg>
