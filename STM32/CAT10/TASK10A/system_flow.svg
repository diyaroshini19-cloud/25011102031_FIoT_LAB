<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2457a7"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="40" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#16243a">CAT10 TASK10A - UART byte bridge</text>
<text x="40" y="94" font-family="Arial,sans-serif" font-size="17" fill="#526176">The firmware forwards terminal bytes to the ESP8266 and relays modem replies</text>
<rect x="36" y="205" width="384" height="260" rx="18" fill="#eaf2ff" stroke="#526176" stroke-width="2"/>
<text x="54" y="243" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16243a">PC terminal</text>
<line x1="54" y1="259" x2="402" y2="259" stroke="#aab6c5"/>
<text x="54" y="289" font-family="Arial,sans-serif" font-size="15" fill="#243247">Input / display</text>
<text x="54" y="316" font-family="Arial,sans-serif" font-size="15" fill="#243247">USART2 adapter</text>
<rect x="448" y="205" width="384" height="260" rx="18" fill="#eaf8f0" stroke="#526176" stroke-width="2"/>
<text x="466" y="243" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16243a">STM32F103C8</text>
<line x1="466" y1="259" x2="814" y2="259" stroke="#aab6c5"/>
<text x="466" y="289" font-family="Arial,sans-serif" font-size="15" fill="#243247">USART2 RX -&gt; USART1 TX</text>
<text x="466" y="316" font-family="Arial,sans-serif" font-size="15" fill="#243247">USART1 RX -&gt; USART2 TX</text>
<text x="466" y="343" font-family="Arial,sans-serif" font-size="15" fill="#243247">Full-duplex forwarding</text>
<rect x="860" y="205" width="384" height="260" rx="18" fill="#fff4df" stroke="#526176" stroke-width="2"/>
<text x="878" y="243" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16243a">ESP8266</text>
<line x1="878" y1="259" x2="1226" y2="259" stroke="#aab6c5"/>
<text x="878" y="289" font-family="Arial,sans-serif" font-size="15" fill="#243247">UART AT-command interface</text>
<text x="878" y="316" font-family="Arial,sans-serif" font-size="15" fill="#243247">Modem responses</text>
<line x1="425" y1="335" x2="443" y2="335" stroke="#2457a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="413" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#2457a7">USART2</text>
<line x1="837" y1="335" x2="855" y2="335" stroke="#2457a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="825" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#2457a7">USART1</text>
<text x="40" y="578" font-family="Arial,sans-serif" font-size="14" fill="#526176">The MCU acts as a serial bridge; the ESP8266 handles its own AT command set.</text>
</svg>
